services:
  postgres:
    image: postgres:16-alpine
    container_name: habit_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: habit_pass
      POSTGRES_USER: habit_user
      POSTGRES_DB: habit_db
    ports:
      - "5433:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit_user -d habit_db -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5  

volumes:
  postgres_data:

